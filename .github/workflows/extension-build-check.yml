name: Extension build check

on:
  push:
    paths:
      - "RER-Reader.user.js"
      - "extension/**"
      - "tests/**"
      - "src/**"
      - "scripts/**"
      - "docs/ROADMAP.md"
      - ".github/workflows/extension-build-check.yml"
  pull_request:
    paths:
      - "RER-Reader.user.js"
      - "extension/**"
      - "tests/**"
      - "src/**"
      - "scripts/**"
      - "docs/ROADMAP.md"
      - ".github/workflows/extension-build-check.yml"
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build canonical userscript
        run: python scripts/build_userscript.py

      - name: Build Firefox and Chrome packages
        run: python extension/build_extension.py

      - name: Validate generated JavaScript
        run: node --check extension/content.js

      - name: Run Reader regression tests
        run: node --test tests/*.test.mjs

      - name: Validate manifests
        run: |
          python -m json.tool extension/manifest.base.json > /dev/null
          python -m json.tool extension/manifest.firefox.json > /dev/null
          python -m json.tool extension/manifest.chrome.json > /dev/null
          python -m json.tool extension/manifest.json > /dev/null
          python -m json.tool extension/dist/firefox/manifest.json > /dev/null
          python -m json.tool extension/dist/chrome/manifest.json > /dev/null

      - name: Lint Firefox package for AMO
        run: npx --yes web-ext@10 lint --source-dir extension/dist/firefox --warnings-as-errors

      - name: Ensure committed generated files are current
        run: git diff --exit-code -- RER-Reader.user.js extension/content.js extension/manifest.json

      - name: Upload browser packages
        uses: actions/upload-artifact@v4
        with:
          name: rer-reader-extension-packages
          path: extension/packages/*.zip
